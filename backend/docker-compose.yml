version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sih_postgres
    restart: always
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: land_records_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sih_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
